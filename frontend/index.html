<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Cortex Health Portal: multimodal dementia screening decision support (research tool)." />
    <!-- First-paint fallback only (= --color-bg in tokens.css, light / dark);
         useTheme() overwrites these from the token once the app loads. -->
    <meta name="theme-color" content="#f8f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#040d12" media="(prefers-color-scheme: dark)" />
    <title>Cortex Health Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <script>
      // Apply a saved theme before first paint (no light->dark flash). The
      // toggle in the nav writes this; absent or unreadable = follow the OS.
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
